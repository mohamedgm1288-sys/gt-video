name: Build GT-video APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Place app code (accepts main.txt or main.dart in the repo root)
        run: |
          mkdir -p lib
          for f in main.txt main.dart; do
            if [ -f "$f" ]; then mv "$f" lib/main.dart; break; fi
          done
          test -f lib/main.dart

      - name: Create Android project around lib/main.dart
        run: |
          mkdir -p /tmp/keep && cp -r lib /tmp/keep/lib
          flutter create --org com.gt --project-name gt_video --platforms android .
          rm -rf lib && cp -r /tmp/keep/lib lib
          flutter pub add supabase_flutter video_player image_picker
          flutter pub add --dev flutter_launcher_icons

      - name: Internet permission and app name
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="GT-video"#' android/app/src/main/AndroidManifest.xml

      - name: Generate app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, math
          from PIL import Image, ImageDraw
          os.makedirs("assets", exist_ok=True)
          S=1024; K=2
          def mask(cx,cy,r):
              P=[(cx-r*0.62,cy-r*0.95),(cx-r*0.62,cy+r*0.95),(cx+r*1.0,cy)]
              a=math.dist(P[1],P[2]);b=math.dist(P[0],P[2]);c=math.dist(P[0],P[1]);p=a+b+c
              I=((a*P[0][0]+b*P[1][0]+c*P[2][0])/p,(a*P[0][1]+b*P[1][1]+c*P[2][1])/p)
              area=abs((P[1][0]-P[0][0])*(P[2][1]-P[0][1])-(P[2][0]-P[0][0])*(P[1][1]-P[0][1]))/2
              d=r*0.12; f=1-d/(area/(p/2))
              q=[((I[0]+(x-I[0])*f)*K,(I[1]+(y-I[1])*f)*K) for x,y in P]; dd=d*K
              m=Image.new("L",(S*K,S*K),0); dr=ImageDraw.Draw(m); dr.polygon(q,fill=255)
              for i in range(3):
                  x,y=q[i]; dr.ellipse((x-dd,y-dd,x+dd,y+dd),fill=255)
                  x2,y2=q[(i+1)%3]; dr.line((x,y,x2,y2),fill=255,width=int(2*dd))
              return m.resize((S,S),Image.LANCZOS)
          def fg(s):
              im=Image.new("RGBA",(S,S),(0,0,0,0)); r=S*0.30*s; cx,cy=S/2+S*0.035*s,S/2
              for dx,dy,col in [(-S*0.055*s,S*0.04*s,(255,176,32,255)),(0,0,(61,224,208,255))]:
                  im.paste(Image.new("RGBA",(S,S),col),(0,0),mask(cx+dx,cy+dy,r))
              return im
          bg=Image.new("RGB",(S,S)); px=bg.load()
          c1=(27,16,48); c2=(86,34,160)
          for y in range(S):
              for x in range(S):
                  t=(x+y)/(2*S-2); px[x,y]=tuple(int(c1[i]+(c2[i]-c1[i])*t) for i in range(3))
          full=bg.convert("RGBA"); full.alpha_composite(fg(1.0)); full.convert("RGB").save("assets/icon.png")
          fg(0.78).save("assets/icon_foreground.png"); bg.save("assets/icon_background.png")
          PY
          cat >> pubspec.yaml <<'EOF'

          flutter_launcher_icons:
            android: true
            image_path: "assets/icon.png"
            adaptive_icon_background: "assets/icon_background.png"
            adaptive_icon_foreground: "assets/icon_foreground.png"
          EOF
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GT-video build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
